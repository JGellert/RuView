name: wifi-densepose sensing-server → Docker Hub + ghcr.io

on:
  push:
    branches: [main]
    paths:
      - 'docker/Dockerfile.rust'
      - 'docker/docker-entrypoint.sh'
      - 'v2/Cargo.toml'
      - 'v2/Cargo.lock'
      - 'v2/crates/**'
      - 'v2/vendor/security/**'
      - 'vendor/ruvector/**'
      - 'vendor/rufield/**'
      - '.gitmodules'
      - 'ui/**'
      - '.github/workflows/sensing-server-docker.yml'
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: sensing-server-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build · ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive

      - name: Resolve image name
        id: image
        run: |
          OWNER="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${OWNER}/wifi-densepose" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build and push architecture image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: docker/Dockerfile.rust
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=build-${{ matrix.arch }}
          cache-to: type=gha,scope=build-${{ matrix.arch }},mode=max
          provenance: false
          sbom: false

      - name: Export image digest
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish · multi-architecture manifest
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Resolve image name
        id: image
        run: |
          OWNER="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${OWNER}/wifi-densepose" >> "$GITHUB_OUTPUT"
          echo "owner=${OWNER}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Download architecture digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Publish multi-architecture image
        id: manifest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DH_IMAGE: docker.io/${{ steps.image.outputs.owner }}/wifi-densepose
        run: |
          set -euo pipefail

          SOURCES=()
          for file in "${RUNNER_TEMP}"/digests/*; do
            digest="$(basename "$file")"
            SOURCES+=("${IMAGE}@sha256:${digest}")
          done

          if [ "${#SOURCES[@]}" -ne 2 ]; then
            echo "Expected exactly two architecture digests."
            ls -la "${RUNNER_TEMP}/digests"
            exit 1
          fi

          TAGS=("sha-${GITHUB_SHA:0:7}")

          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            TAGS+=("main" "latest")
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAGS+=("${GITHUB_REF#refs/tags/}")
          else
            TAGS+=("${GITHUB_REF_NAME}")
          fi

          TAG_ARGS=()
          for tag in "${TAGS[@]}"; do
            TAG_ARGS+=(--tag "${IMAGE}:${tag}")
          done

          echo "Publishing GHCR manifest:"
          docker buildx imagetools create "${TAG_ARGS[@]}" "${SOURCES[@]}"

          if [[ -n "$DH_USER" && -n "$DH_TOKEN" ]]; then
            echo "$DH_TOKEN" | docker login docker.io \
              --username "$DH_USER" --password-stdin

            DH_TAG_ARGS=()
            for tag in "${TAGS[@]}"; do
              DH_TAG_ARGS+=(--tag "${DH_IMAGE}:${tag}")
            done

            docker buildx imagetools create \
              "${DH_TAG_ARGS[@]}" "${SOURCES[@]}"
          else
            echo "::warning::Docker Hub credentials not configured; publishing to GHCR only."
          fi

          {
            echo "## Published sensing-server image"
            echo
            echo "Image: ${IMAGE}"
            echo
            echo "Architectures: linux/amd64, linux/arm64"
            echo
            echo "Tags:"
            for tag in "${TAGS[@]}"; do
              echo "- ${tag}"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify multi-architecture manifest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          set -euo pipefail

          docker buildx imagetools inspect "${IMAGE}:sha-${GITHUB_SHA:0:7}"

          docker buildx imagetools inspect "${IMAGE}:sha-${GITHUB_SHA:0:7}" \
            --raw > manifest.json

          python3 - <<'PY'
          import json

          with open("manifest.json") as f:
              manifest = json.load(f)

          platforms = {
              (item.get("platform", {}).get("os"),
               item.get("platform", {}).get("architecture"))
              for item in manifest.get("manifests", [])
          }

          required = {("linux", "amd64"), ("linux", "arm64")}
          print("Detected platforms:", sorted(platforms))

          missing = required - platforms
          if missing:
              raise SystemExit(f"Missing platforms: {sorted(missing)}")
          PY

  smoke-test:
    name: smoke-test · published image
    needs: publish
    runs-on: ubuntu-24.04

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke-test image assets and LAN HTTP
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/wifi-densepose:sha-${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          IMAGE="${IMAGE%:*}:sha-${GITHUB_SHA:0:7}"

          docker pull "$IMAGE"

          docker run --rm --entrypoint sh "$IMAGE" -c \
            'ls /app/ui/observatory.html /app/ui/pose-fusion.html /app/ui/index.html /app/ui/viz.html >/dev/null'

          docker run --rm --entrypoint sh "$IMAGE" -c \
            'ls -d /app/ui/observatory /app/ui/pose-fusion >/dev/null'

          docker run -d --name sm -p 3000:3000 \
            -e CSI_SOURCE=simulated \
            -e RUVIEW_ALLOW_UNAUTHENTICATED=1 \
            "$IMAGE"

          cleanup() { docker rm -f sm >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:3000/health
          curl -fsS http://127.0.0.1:3000/api/v1/info >/dev/null
          curl -fsS http://127.0.0.1:3000/ui/observatory.html >/dev/null
          curl -fsS http://127.0.0.1:3000/ui/pose-fusion.html >/dev/null

      - name: Smoke-test bearer-token authentication
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/wifi-densepose:sha-${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          IMAGE="${IMAGE%:*}:sha-${GITHUB_SHA:0:7}"

          docker run -d --name auth -p 3000:3000 \
            -e CSI_SOURCE=simulated \
            -e RUVIEW_API_TOKEN=smoke-test-token-do-not-use \
            "$IMAGE"

          cleanup() { docker rm -f auth >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:3000/health >/dev/null

          code=$(curl -s -o /dev/null -w '%{http_code}' \
            http://127.0.0.1:3000/api/v1/info)
          test "$code" = "401" || {
            echo "Expected 401, got $code"
            exit 1
          }

          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'Authorization: Bearer wrong' \
            http://127.0.0.1:3000/api/v1/info)
          test "$code" = "401" || {
            echo "Expected 401 for wrong token, got $code"
            exit 1
          }

          curl -fsS \
            -H 'Authorization: Bearer smoke-test-token-do-not-use' \
            http://127.0.0.1:3000/api/v1/info >/dev/null
